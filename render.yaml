# Review provider pricing and regions before creating resources.
services:
  - type: web
    name: beyond-the-number-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    preDeployCommand: alembic upgrade head
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.12
      - key: DATABASE_URL
        fromDatabase:
          name: beyond-the-number-db
          property: connectionString
      - key: ALLOWED_ORIGINS
        sync: false

databases:
  - name: beyond-the-number-db
    databaseName: beyond
    user: beyond
