name: Checks
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: beyond_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements-dev.txt
      - run: python -m pytest -q
        working-directory: backend
      - run: python -m pytest -q
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgresql+psycopg://postgres@localhost:5432/beyond_test
      - run: alembic upgrade head && alembic check
        working-directory: backend
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements-dev.txt
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Prepare isolated browser database
        working-directory: backend
        env:
          DATABASE_URL: sqlite:////tmp/beyond-ci.db
          E2E_DISPOSABLE_DB: 'yes'
          PYTHONPATH: .
        run: |
          alembic upgrade head
          python ../scripts/prepare_e2e.py
      - name: Start backend and frontend
        run: |
          (cd backend && DATABASE_URL=sqlite:////tmp/beyond-ci.db python -m uvicorn app.main:app --port 8000 > /tmp/api.log 2>&1) &
          npm run dev > /tmp/web.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/api/health && curl -fsS http://localhost:5173/ > /dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - run: npm run test:e2e
